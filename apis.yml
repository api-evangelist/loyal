name: Loyal
description: 'Loyal (Cellular Longevity, Inc.) is a clinical-stage veterinary biotechnology
  company developing drugs intended to extend the healthy lifespan of dogs. Its lead
  programs — including LOY-002 for metabolic dysfunction in senior dogs and LOY-001/LOY-003
  for large- and giant-breed dogs — are advancing through the FDA Center for Veterinary
  Medicine approval process, with more than 1,300 dogs enrolled across clinical studies.
  Loyal also runs a veterinary Learning Hub for practitioner education. The company is
  backed by Bain Capital Ventures and First Round Capital. As of this enrichment pass
  Loyal publishes no public developer API, OpenAPI/AsyncAPI specification, SDK, MCP server,
  or /.well-known discovery surface; this profile captures its public web identity and
  a live domain-security probe.'
